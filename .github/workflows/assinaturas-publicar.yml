name: Publicar assinaturas

# Envia a pasta assinaturas/ para o servidor por FTP.
# Antes do primeiro uso, crie os segredos FTP_SERVER, FTP_USERNAME e FTP_PASSWORD
# em Settings > Secrets and variables > Actions. Veja assinaturas/docs/PUBLICACAO.md.

on:
  push:
    paths:
      - 'assinaturas/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-assinaturas
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar no servidor
    # Publica quando a alteração chega à branch principal do repositório ou quando alguém roda o fluxo à mão,
    # o que permite publicar uma correção direto de uma branch.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os segredos de FTP
        id: segredos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            echo "Publicação não realizada: faltam os segredos FTP_SERVER, FTP_USERNAME e FTP_PASSWORD." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Publicação não realizada: crie os segredos de FTP descritos em assinaturas/docs/PUBLICACAO.md."
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.segredos.outputs.pronto == 'sim'
        with:
          php-version: '8.3'
          extensions: gd, curl, mbstring, pdo_sqlite, exif, fileinfo
          coverage: none

      - name: Testar antes de publicar
        if: steps.segredos.outputs.pronto == 'sim'
        working-directory: assinaturas
        run: |
          find app public bin -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/unit.php
          node --test tests/renderer.test.mjs
          node tests/layout.test.mjs

      # O config.php, as imagens dos clientes e o conteúdo de storage ficam só no servidor e nunca são apagados.

      # Formato 1: a pasta do projeto vai inteira para um lugar só (a raiz do site aponta para "public").
      - name: Enviar os arquivos por FTP
        if: steps.segredos.outputs.pronto == 'sim' && vars.FTP_PUBLIC_DIR == ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./assinaturas/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            tools/**
            docs/**
            config.php

      # Formato 2: a pasta pública do servidor tem outro nome (public_html, por exemplo).
      # O conteúdo de "public" vai para ela e o restante fica na pasta do site.
      - name: Enviar a pasta pública por FTP
        if: steps.segredos.outputs.pronto == 'sim' && vars.FTP_PUBLIC_DIR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./assinaturas/public/
          server-dir: ${{ vars.FTP_PUBLIC_DIR }}
          state-name: .ftp-deploy-publico.json
          exclude: |
            **/.git*
            **/.git*/**

      - name: Enviar o restante por FTP
        if: steps.segredos.outputs.pronto == 'sim' && vars.FTP_PUBLIC_DIR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./assinaturas/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sistema.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            public/**
            tests/**
            tools/**
            docs/**
            config.php
